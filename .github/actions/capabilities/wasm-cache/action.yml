name: WASM Cache
description: Cache WASM build output (both CLDR variants) to skip recompilation.

runs:
  using: composite
  steps:
    - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      id: wasm-cache
      with:
        path: |
          web_assets/icu4x.wasm
          web_assets/icu4x-lean.wasm
        key: wasm-${{ runner.os }}-${{ runner.arch }}-${{ env.SUBMODULE_ICU4X }}
