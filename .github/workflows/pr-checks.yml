# PR Checks — conventional-commit title, promotion chain, changelog-version
# sanity (both lanes), and workflow + shell lint, all via the shared reusable
# workflow. One local gate stays: the whuppi/ci ref-consistency check below.
# (No pin-availability job here: this repo's only local pin is pana, resolved
# from pub.dev — no sha-pinned download assets to HEAD.)
name: PR Checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [dev, prod]
  workflow_dispatch:

permissions: {}

# One in-flight run per PR; new pushes cancel the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    permissions:
      contents: read  # the reusable jobs only checkout + lint, read-only
    uses: whuppi/ci/.github/workflows/pr-checks.yml@v2.0.5

  ci-ref-consistency:
    name: whuppi/ci ref consistency
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read  # checkout only; greps workflow refs
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # The vendored make-target fork pins whuppi/ci capabilities separately
      # from the workflows and dependabot's whuppi-ci group does NOT reach
      # inside it — so it has drifted (v1.0.1 vs v1.0.4) before. Fail the PR if
      # any whuppi/ci ref across .github is on a different version than the rest.
      - name: whuppi/ci refs share one version
        shell: bash
        run: |
          v=$(grep -rhoE 'whuppi/ci/[^@[:space:]]*@v[0-9.]+' .github | grep -oE 'v[0-9.]+' | sort -u | tr '\n' ' ')
          if [ "$(printf '%s' "$v" | wc -w)" -gt 1 ]; then
            echo "::error::whuppi/ci refs span multiple versions: $v"
            exit 1
          fi
          echo "whuppi/ci refs all on: $v"
