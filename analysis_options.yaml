include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - 'vendor/**'      # Vendored ICU4X submodule
    # Generated *.g.dart bindings are deliberately NOT excluded here. pub.dev's
    # pana scorer IGNORES analyzer.exclude and lints every shipped .dart file,
    # so an exclude would only blind local `dart analyze` to the exact lints
    # pana scores — the gap that once cost 10 points silently. Instead the
    # generated tree carries lib/src/runtime/analysis_options.yaml, which pana
    # DOES respect (nested options are resolved per-file), turning off the lints
    # that Diplomat output can't satisfy. Net: local analyze == pana, and a
    # future regen that trips a new lint is caught locally, not at publish.

linter:
  rules:
    # Requires Dart 3.12+ syntax but SDK constraint is >=3.10.0.
    # Enable when minimum SDK is bumped to 3.12.
    use_null_aware_elements: false

    # ── Documentation ──────────────────────────────────────────────────
    public_member_api_docs: true

    # ── Bug prevention ─────────────────────────────────────────────────
    cancel_subscriptions: true
    close_sinks: true
    unawaited_futures: true
    avoid_void_async: true
    discarded_futures: true
    no_adjacent_strings_in_list: true
    test_types_in_equals: true
    throw_in_finally: true
    unnecessary_statements: true

    # ── API quality ────────────────────────────────────────────────────
    comment_references: true
    prefer_final_locals: true
    # ON for hand-written code; the generated tree turns it (and
    # public_member_api_docs + comment_references) off via its nested
    # lib/src/runtime/analysis_options.yaml, because Diplomat output emits
    # fields before constructors and is regenerated, never hand-sorted.
    sort_constructors_first: true
    use_string_buffers: true
    avoid_unused_constructor_parameters: true
    prefer_asserts_in_initializer_lists: true

    # ── Safety ─────────────────────────────────────────────────────────
    avoid_type_to_string: true
    literal_only_boolean_expressions: true
    prefer_void_to_null: true
